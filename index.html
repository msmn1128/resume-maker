<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 外部への通信を一切禁止（入力データが外に出ないことをブラウザ側で保証） -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>履歴書メーカー</title>
<style>
:root { --accent:#1f5fbf; --bg:#f3f4f6; }
* { box-sizing:border-box; }
body { margin:0; font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; background:var(--bg); color:#111; }
.ui { font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif; }
.app { display:grid; grid-template-columns:minmax(320px,440px) 1fr; min-height:100vh; }
.panel { background:#fff; border-right:1px solid #ddd; padding:20px; overflow-y:auto; height:100vh; position:sticky; top:0; }
.panel h1 { font-size:20px; margin:0 0 4px; }
.privacy { font-size:12px; color:#355; background:#eef7f0; border:1px solid #cfe5d4; border-radius:8px; padding:8px 10px; margin:8px 0 16px; line-height:1.6; }
fieldset { border:1px solid #e1e1e1; border-radius:10px; margin:0 0 14px; padding:10px 12px 12px; min-width:0; }
legend { font-size:13px; font-weight:700; padding:0 6px; color:var(--accent); }
label { display:block; font-size:12px; color:#555; margin:8px 0 3px; }
input[type=text], input[type=date], input[type=tel], input[type=email], textarea, select {
  width:100%; padding:8px 9px; font-size:14px; border:1px solid #ccc; border-radius:6px; font-family:inherit; background:#fff; }
textarea { resize:vertical; min-height:70px; }
.row2 { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; }
.row2 > div { min-width:0; }
.hrow { display:grid; grid-template-columns:62px 44px 1fr 28px; gap:4px; margin-bottom:5px; }
.hrow input { padding:6px; font-size:13px; }
button { font-family:inherit; cursor:pointer; border-radius:6px; border:1px solid #bbb; background:#fff; padding:6px 10px; font-size:12px; }
button:hover { background:#f0f0f0; }
button.primary { background:var(--accent); color:#fff; border-color:var(--accent); font-size:15px; padding:11px 14px; width:100%; font-weight:700; }
button.primary:hover { background:#174a96; }
button.danger { color:#b3261e; border-color:#e6b8b4; }
.btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.photo-row { display:flex; gap:10px; align-items:center; }
.photo-row > div:last-child { min-width:0; }
.photo-thumb { width:60px; height:80px; border:1px dashed #aaa; background:#fafafa center/cover no-repeat; flex:none; }
.note { font-size:11px; color:#777; margin-top:4px; line-height:1.5; }
.note.err { color:#b3261e; }
.preview { padding:24px; overflow:auto; }
.preview-inner { display:flex; flex-direction:column; align-items:center; gap:20px; }

/* ===== 履歴書本体（A4×2ページ。名古屋ビジネス・アカデミー様式に合わせた寸法 / 単位mm） ===== */
.page { width:210mm; height:297mm; background:#fff; position:relative; overflow:hidden; font-size:10.5pt; color:#000;
  box-shadow:0 2px 12px rgba(0,0,0,.18); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
.page .content { position:absolute; width:167mm; }
.p1 .content { left:26mm; top:20mm; }
.p2 .content { left:22mm; top:21mm; }
.n { display:inline-block; text-align:center; }
.lbl { font-size:8.5pt; letter-spacing:.08em; justify-content:center; text-align:center; }

/* 1ページ目：ヘッダ */
.head { position:relative; height:18mm; }
.head h2 { margin:0; font-size:20pt; font-weight:500; letter-spacing:1.2em; line-height:1; padding-top:3mm; }
.head .date { position:absolute; left:0; width:118mm; top:11mm; text-align:right; font-size:9.5pt; }
.photo-box { position:absolute; left:124mm; top:2mm; width:34mm; height:46mm; border:.2mm solid #666;
  display:flex; align-items:center; justify-content:center; text-align:center; font-size:8.5pt; line-height:1.9; color:#333; z-index:2; background:#fff; }
.photo-box .img { width:30mm; height:40mm; background:center/cover no-repeat; }

/* 基本情報ボックス */
.A { display:grid; grid-template-columns:19mm 100mm 6mm 41mm;
  grid-template-rows:5.5mm 17.5mm 11.4mm 5.5mm 10.5mm 6.7mm 8.2mm 6.1mm 5.2mm 11.1mm; width:166mm; }
.A > div { border-right:.2mm solid #000; border-bottom:.2mm solid #000; padding:0 1.5mm; display:flex; align-items:center; overflow:hidden; min-width:0; }
.A .dot { border-bottom:.2mm dotted #444; }
.A .et { border-top:.5mm solid #000; }
.A .el { border-left:.5mm solid #000; }
.A .er { border-right:.5mm solid #000; }
.A .eb { border-bottom:.5mm solid #000; }
.A .sp { border:none; border-bottom:.5mm solid #000; padding:0; }
.A .blk { display:block; padding-top:.8mm; }
.A .small { font-size:6.5pt; color:#333; line-height:1; margin-bottom:.4mm; }
.A .furi { font-size:8.5pt; }
.A .name { font-size:18pt; }
.A .zip { font-size:9pt; height:4.6mm; display:flex; align-items:center; gap:2mm; white-space:nowrap; }
.A .zip .zn { display:inline-block; min-width:21mm; text-align:center; }
.A .zip .hint { font-size:6pt; color:#444; margin-left:3mm; }
.A .addr { font-size:10pt; line-height:1.3; }
.A .birth { font-size:10pt; white-space:nowrap; padding-left:12mm; }
.A .tv { font-size:9.5pt; }

/* 学歴・職歴ボックス */
.B { display:grid; grid-template-columns:19mm 1fr; border:.5mm solid #000; height:147mm; margin-top:4.5mm; width:166mm; }
.vl { display:flex; align-items:center; justify-content:center; writing-mode:vertical-rl; text-orientation:upright; letter-spacing:.75em; font-size:9pt; padding-top:.75em; }
.B > .vl { border-right:.2mm solid #000; }
.rows { display:flex; flex-direction:column; min-width:0; }
.hr { flex:1; display:grid; grid-template-columns:34mm 1fr; border-bottom:.2mm dotted #555; min-height:0; }
.hr:last-child { border-bottom:none; }
.lic .hr { grid-template-columns:36mm 1fr; }
.ym { display:grid; grid-template-columns:44% 18% 23.5% 14.5%; align-items:center; border-right:.2mm solid #000; font-size:9.5pt; }
.ym .y, .ym .m { text-align:right; font-size:10.5pt; padding-right:.6mm; }
.hr .tx { display:flex; align-items:center; padding:0 2.5mm; font-size:10.5pt; min-width:0; overflow:hidden; white-space:nowrap; }
.hr .tx.ctr { justify-content:center; letter-spacing:.6em; }
.hr .tx.rgt { justify-content:flex-end; }

/* 2ページ目 */
.C { border:.5mm solid #000; height:254.5mm; width:166mm; display:flex; flex-direction:column; }
.sec { display:grid; grid-template-columns:18mm 1fr; border-top:.3mm solid #000; min-height:0; }
.sec:first-child { border-top:none; }
.sec > .vl { border-right:.2mm solid #000; }
.s1 { height:69mm; } .s2 { height:73.5mm; } .s3 { height:83mm; } .s4 { flex:1; }
.s1 .rows .hd { height:5.5mm; display:grid; grid-template-columns:36mm 1fr; border-bottom:.2mm solid #000; font-size:8.5pt; letter-spacing:.3em; }
.s1 .hd div { display:flex; align-items:center; justify-content:center; }
.s1 .hd div:first-child { border-right:.2mm solid #000; }
.cols { display:grid; grid-template-columns:1fr 1fr; min-width:0; }
.cols > div { min-width:0; }
.cols > div + div { border-left:.2mm solid #000; }
.colhd { height:9.2mm; line-height:9.2mm; font-size:8.5pt; padding:0 2mm; border-bottom:.2mm dotted #555; white-space:nowrap; }
.ruled { position:relative; overflow:hidden; font-size:10.5pt; }
.ruled .rl { position:absolute; left:0; right:0; top:0; bottom:0; display:flex; flex-direction:column; }
.ruled .rl i { display:block; flex:none; height:9.2mm; border-bottom:.2mm dotted #555; }
.ruled .rl i:last-child { border-bottom:none; }
.ruled .rt { position:relative; line-height:9.2mm; padding:0 2mm; white-space:pre-wrap; overflow-wrap:anywhere; }
.s2 .ruled { height:64.3mm; }
.s3 .ruled { height:100%; }
.plain { padding:2mm 2.5mm; white-space:pre-wrap; overflow-wrap:anywhere; overflow:hidden; line-height:1.6; font-size:10.5pt; height:100%; }

@media (max-width:1100px) {
  .app { grid-template-columns:1fr; }
  .panel { height:auto; position:static; }
  .preview { padding:12px; }
  .page { zoom:.5; }
}
@media print {
  @page { size:A4; margin:0; }
  body { background:#fff; }
  .panel { display:none !important; }
  .app { display:block; }
  .preview { padding:0; overflow:visible; }
  .preview-inner { display:block; gap:0; }
  .page { box-shadow:none; margin:0; zoom:1 !important; break-after:page; page-break-after:always; }
  .page:last-child { break-after:auto; page-break-after:auto; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel ui">
    <h1>履歴書メーカー</h1>
    <div class="privacy">🔒 入力内容はこの端末のブラウザ内にだけ保存されます。サーバーには一切送信されません（通信自体をブロックしています）。共用PCでは使用後に「データを消去」を押してください。</div>

    <button class="primary" id="btnPrint">PDFを出力（印刷 → PDFとして保存）</button>
    <div class="note">印刷画面で送信先を「PDFに保存」、用紙サイズを A4、余白を「なし」にしてください（2ページ出力されます）。</div>
    <div class="btns" style="margin-bottom:14px">
      <button id="btnExport">バックアップ保存(JSON)</button>
      <button id="btnImport">バックアップ読込</button>
      <button id="btnClear" class="danger">データを消去</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
    <div class="note err" id="fitNote"></div>

    <fieldset><legend>基本情報</legend>
      <label>日付（作成日）</label><input type="date" id="f_date">
      <div class="row2">
        <div><label>ふりがな</label><input type="text" id="f_furigana" autocomplete="off"></div>
        <div><label>氏名</label><input type="text" id="f_name" autocomplete="off"></div>
      </div>
      <label>生年月日</label><input type="date" id="f_birth">
      <label>顔写真（任意・端末内のみで処理）</label>
      <div class="photo-row">
        <div class="photo-thumb" id="photoThumb"></div>
        <div><input type="file" id="f_photo" accept="image/*"> <button id="btnPhotoDel">削除</button></div>
      </div>
    </fieldset>

    <fieldset><legend>現住所</legend>
      <label>ふりがな</label><input type="text" id="f_addrFurigana" autocomplete="off">
      <div class="row2">
        <div><label>郵便番号</label><input type="text" id="f_zip" inputmode="numeric" placeholder="460-0001" autocomplete="off"></div>
        <div></div>
      </div>
      <label>住所</label><input type="text" id="f_addr" autocomplete="off">
      <div class="row2">
        <div><label>電話</label><input type="tel" id="f_tel" autocomplete="off"></div>
        <div><label>携帯</label><input type="tel" id="f_mobile" autocomplete="off"></div>
      </div>
      <label>E-mailアドレス</label><input type="email" id="f_email" autocomplete="off">
    </fieldset>

    <fieldset><legend>連絡先（現住所以外を希望する場合のみ）</legend>
      <label>ふりがな</label><input type="text" id="f_cFurigana" autocomplete="off">
      <div class="row2">
        <div><label>郵便番号</label><input type="text" id="f_cZip" inputmode="numeric" autocomplete="off"></div>
        <div></div>
      </div>
      <label>住所</label><input type="text" id="f_cAddr" autocomplete="off">
      <div class="row2">
        <div><label>電話</label><input type="tel" id="f_cTel" autocomplete="off"></div>
        <div><label>携帯</label><input type="tel" id="f_cMobile" autocomplete="off"></div>
      </div>
    </fieldset>

    <fieldset><legend>学歴・職歴（最大14行）</legend>
      <div id="histList"></div>
      <div class="btns">
        <button data-add="row">＋行を追加</button>
        <button data-add="学歴">＋「学歴」見出し</button>
        <button data-add="職歴">＋「職歴」見出し</button>
        <button data-add="以上">＋「以上」</button>
      </div>
      <div class="note">年・月を空にすると、内容だけの行（見出し等）になります。「学歴」「職歴」は中央揃い、「以上」は右寄せで表示します。</div>
      <div class="note err" id="histNote"></div>
    </fieldset>

    <fieldset><legend>免許・資格等（最大7行）</legend>
      <div id="licList"></div>
      <div class="btns"><button data-add="lic">＋行を追加</button></div>
      <div class="note err" id="licNote"></div>
    </fieldset>

    <fieldset><legend>趣味・得意な学科・スポーツ等</legend>
      <textarea id="f_hobby" rows="4"></textarea>
    </fieldset>
    <fieldset><legend>特技・自己啓発等</legend>
      <textarea id="f_skill" rows="4"></textarea>
    </fieldset>
    <fieldset><legend>志望の動機</legend>
      <textarea id="f_motive" rows="6"></textarea>
    </fieldset>
    <fieldset><legend>備考</legend>
      <textarea id="f_remarks" rows="3"></textarea>
    </fieldset>
  </aside>

  <main class="preview">
    <div class="preview-inner" id="pages"></div>
  </main>
</div>

<script>
(() => {
  const KEY = 'resume-maker-v1';
  const HIST_ROWS = 14, LIC_ROWS = 7;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const blank = () => ({
    date: new Date().toISOString().slice(0,10),
    furigana:'', name:'', birth:'', photo:'',
    addrFurigana:'', zip:'', addr:'', tel:'', mobile:'', email:'',
    cFurigana:'', cZip:'', cAddr:'', cTel:'', cMobile:'',
    hist:[{y:'',m:'',t:''}], lic:[{y:'',m:'',t:''}],
    hobby:'', skill:'', motive:'', remarks:''
  });

  let data = load();

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const d = Object.assign(blank(), JSON.parse(raw));
        if (d.wish && !d.remarks) d.remarks = d.wish; // 旧バージョンからの移行
        return d;
      }
    } catch (e) {}
    return blank();
  }
  let timer;
  function save() {
    clearTimeout(timer);
    timer = setTimeout(() => {
      try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { alert('保存に失敗しました（容量不足の可能性）。写真を小さくするか不要データを消してください。'); }
    }, 250);
  }

  const simple = ['date','furigana','name','birth','addrFurigana','zip','addr','tel','mobile','email',
                  'cFurigana','cZip','cAddr','cTel','cMobile','hobby','skill','motive','remarks'];
  simple.forEach(k => {
    const el = $('f_' + k);
    el.addEventListener('input', () => { data[k] = el.value; save(); render(); });
  });

  function fillForm() {
    simple.forEach(k => $('f_' + k).value = data[k] || '');
    buildList('hist'); buildList('lic'); updateThumb();
  }

  function buildList(kind) {
    const box = $(kind === 'hist' ? 'histList' : 'licList');
    box.textContent = '';
    data[kind].forEach((r, i) => {
      const row = document.createElement('div'); row.className = 'hrow';
      const mk = (key, ph, inputmode) => {
        const inp = document.createElement('input'); inp.type = 'text'; inp.placeholder = ph; inp.value = r[key]; inp.autocomplete = 'off';
        if (inputmode) inp.inputMode = inputmode;
        inp.addEventListener('input', () => { r[key] = inp.value; save(); render(); });
        return inp;
      };
      const del = document.createElement('button'); del.textContent = '×'; del.title = '削除';
      del.addEventListener('click', () => { data[kind].splice(i,1); if (!data[kind].length) data[kind].push({y:'',m:'',t:''}); save(); buildList(kind); render(); });
      row.append(mk('y','年','numeric'), mk('m','月','numeric'), mk('t','内容'), del);
      box.appendChild(row);
    });
  }

  document.addEventListener('click', e => {
    const a = e.target.closest('[data-add]'); if (!a) return;
    const v = a.dataset.add;
    if (v === 'lic') data.lic.push({y:'',m:'',t:''});
    else if (v === 'row') data.hist.push({y:'',m:'',t:''});
    else {
      const last = data.hist[data.hist.length-1];
      if (last && !last.y && !last.m && !last.t) last.t = v; else data.hist.push({y:'',m:'',t:v});
    }
    save(); buildList(v === 'lic' ? 'lic' : 'hist'); render();
  });

  // ---- 写真（縮小してJPEG化、端末内のみ） ----
  $('f_photo').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    if (!f.type.startsWith('image/')) { alert('画像ファイルを選んでください'); return; }
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.onload = () => {
      const W = 300, H = 400;
      const c = document.createElement('canvas'); c.width = W; c.height = H;
      const ctx = c.getContext('2d');
      const s = Math.max(W / img.width, H / img.height);
      const w = img.width * s, h = img.height * s;
      ctx.fillStyle = '#fff'; ctx.fillRect(0,0,W,H);
      ctx.drawImage(img, (W-w)/2, (H-h)/2, w, h);
      data.photo = c.toDataURL('image/jpeg', 0.85);
      URL.revokeObjectURL(url); save(); updateThumb(); render();
    };
    img.onerror = () => { URL.revokeObjectURL(url); alert('画像を読み込めませんでした'); };
    img.src = url; e.target.value = '';
  });
  $('btnPhotoDel').addEventListener('click', () => { data.photo = ''; save(); updateThumb(); render(); });
  function updateThumb() { $('photoThumb').style.backgroundImage = data.photo ? `url("${data.photo}")` : ''; }

  // ---- バックアップ / 消去 ----
  $('btnExport').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'resume-backup.json'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
  $('btnImport').addEventListener('click', () => $('fileImport').click());
  $('fileImport').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try { data = Object.assign(blank(), JSON.parse(r.result)); save(); fillForm(); render(); }
      catch { alert('読み込めないファイルです'); }
    };
    r.readAsText(f); e.target.value = '';
  });
  $('btnClear').addEventListener('click', () => {
    if (!confirm('この端末に保存された入力内容をすべて消去します。よろしいですか？')) return;
    localStorage.removeItem(KEY); data = blank(); fillForm(); render();
  });
  $('btnPrint').addEventListener('click', () => window.print());

  // ---- プレビュー描画 ----
  const ymd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); return m ? {y:+m[1], mo:+m[2], d:+m[3]} : null; };
  const age = b => { const d = new Date(), x = ymd(b); if (!x) return ''; let a = d.getFullYear() - x.y; if (d.getMonth()+1 < x.mo || (d.getMonth()+1 === x.mo && d.getDate() < x.d)) a--; return a; };
  const n = (v, w) => `<span class="n" style="min-width:${w}mm">${esc(v)}</span>`;

  function rowsHtml(list, N) {
    const rows = list.filter(r => r.y || r.m || r.t);
    let html = '';
    for (let i = 0; i < N; i++) {
      const r = rows[i] || {y:'',m:'',t:''};
      const isBlank = !r.y && !r.m && !r.t;
      const showYM = isBlank || r.y || r.m;
      const heading = !r.y && !r.m;
      const tc = heading && (r.t === '学歴' || r.t === '職歴') ? 'ctr' : (heading && r.t === '以上' ? 'rgt' : '');
      html += `<div class="hr"><div class="ym">${showYM ? `<span class="y">${esc(r.y)}</span><span>年</span><span class="m">${esc(r.m)}</span><span>月</span>` : ''}</div><div class="tx ${tc}">${esc(r.t)}</div></div>`;
    }
    return {html, over: rows.length > N};
  }

  // 罫線入りのテキスト欄（罫線は個別の要素で描く：PDFでの欠けを防ぐため）
  const ruled = (text, lines, label) =>
    `<div class="ruled" data-fit="${label}"><div class="rl">${'<i></i>'.repeat(lines)}</div><div class="rt">${esc(text)}</div></div>`;

  function render() {
    const d = data, dt = ymd(d.date), b = ymd(d.birth);
    const photo = d.photo
      ? `<div class="img" style="background-image:url('${d.photo}')"></div>`
      : '写真をはる位置<br>(30×40mm)<br>○本人単身／胸から上';
    const h = rowsHtml(d.hist, HIST_ROWS);
    const l = rowsHtml(d.lic, LIC_ROWS);
    const birth = `${n(b ? b.y : '', 11)}年 ${n(b ? b.mo : '', 8)}月 ${n(b ? b.d : '', 8)}日生　(満 ${n(b ? age(d.birth) : '', 9)}歳)`;

    const p1 = `
<section class="page p1"><div class="content">
  <div class="head">
    <h2>履歴書</h2>
    <div class="date">${n(dt ? dt.y : '', 12)}年${n(dt ? dt.mo : '', 9)}月${n(dt ? dt.d : '', 9)}日現在</div>
    <div class="photo-box">${photo}</div>
  </div>
